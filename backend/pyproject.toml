[project]
name = "agenda-juri"
version = "0.1.0"
description = "Backend da Agenda Juri"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.5.0,<6",
    "cryptography>=46.0.0",
    "dj-database-url>=3.1.2",
    "django-cors-headers>=4.9.0",
    "django>=6.0.6",
    "google-api-python-client>=2.194.0",
    "google-auth>=2.49.2",
    "idna>=3.15",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.3.3",
    "openai>=1.68.0,<3",
    "requests>=2.33.1",
    "urllib3>=2.7.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "black>=24",
    "isort>=5.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "safety>=3.2",
    "prospector>=1.13",
    "coverage>=7.6",
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=6",
]

[tool.isort]
profile = "black"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ['migrations/', '\.venv/', 'loadtest/']

[tool.django-stubs]
django_settings_module = "jurisagenda.settings"
