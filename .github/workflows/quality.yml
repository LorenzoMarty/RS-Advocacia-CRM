name: Quality gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Weekly, so a new advisory fails the audit job even without a PR.
    - cron: "0 9 * * 1"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agenda_juri
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # DEBUG=true unlocks Django's dev SECRET_KEY fallback and skips the
      # GOOGLE_TOKEN_ENCRYPTION_KEY requirement (settings.py only enforces
      # both when DEBUG is off). DATABASE_URL is always required.
      DEBUG: "true"
      # The postgres:16-alpine service has no SSL cert configured, so
      # disable it explicitly (settings.py defaults to sslmode=require
      # unless DEBUG is on, and setdefault() never overrides a URL-supplied
      # sslmode anyway).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/agenda_juri?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run python manage.py test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: npm audit (production dependencies, high severity)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: pip-audit (production dependencies)
        working-directory: backend
        # Audits the locked runtime set only, not dev tooling. pip-audit has no
        # severity filter, so any known vulnerability fails; document a false
        # positive with --ignore-vuln <ID> and a comment here.
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps
