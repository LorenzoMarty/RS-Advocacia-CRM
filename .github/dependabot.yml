version: 2
# Grouped weekly updates for minor/patch only. Major versions (tailwind 4, eslint 10,
# openai 3...) need a migration and get their own PR by hand. Security updates are not affected
# by `ignore`. ruff is 0.x, so its minors can add lint rules: it is pinned to patch updates.
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: ruff
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 7.1 adds set-state-in-effect lint errors across many components.
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
