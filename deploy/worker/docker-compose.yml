# Worker stack for meeting-recording processing (runs on the always-on VM).
#
# - redis: Celery broker. Only the TLS port (6380) is published so Vercel can
#   enqueue; the worker talks to it over the internal compose network.
# - worker: Celery worker consuming `processar_gravacao` tasks.
#
# First-time setup:
#   1. cp .env.example .env   (fill in prod values)
#   2. ./redis/gen-certs.sh   (self-signed certs in redis/certs/)
#   3. docker compose up -d
# Update after a git pull:
#   docker compose up -d --build worker

services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --port 6379
      --tls-port 6380
      --tls-cert-file /certs/redis.crt
      --tls-key-file /certs/redis.key
      --tls-ca-cert-file /certs/ca.crt
      --tls-auth-clients no
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6380:6380"
    volumes:
      - ./redis/certs:/certs:ro
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ../../backend
    env_file: .env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A jurisagenda inspect ping -t 10 | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  redis-data: {}
